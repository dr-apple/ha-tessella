<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessella Harness</title>
  <style>:root{--primary-background-color:#111;--primary-text-color:#eee;--primary-color:#03a9f4}body{margin:0;background:#111}</style>
</head>
<body>
  <tessella-panel id="panel" style="display:block;height:100vh"></tessella-panel>
  <script src="../../custom_components/tessella/frontend/tessella-panel.js"></script>
  <script>
    // Fake-Home-Assistant für die Browserprüfung. Ersetzt nur hass; das Panel-Verhalten bleibt echt.
    window.__calls = [];
    const states = {
      "light.wohnzimmer": { state: "on", attributes: { friendly_name: "Wohnzimmer", brightness: 128 } },
      "switch.kaffee": { state: "off", attributes: { friendly_name: "Kaffeemaschine" } },
      "sensor.temp": { state: "21.4", attributes: { friendly_name: "Temperatur", unit_of_measurement: "°C" } },
      "climate.bad": { state: "heat", attributes: { friendly_name: "Bad", current_temperature: 20.5, temperature: 22, temperature_unit: "°C", target_temp_step: 0.5 } },
      "cover.garage": { state: "closed", attributes: { friendly_name: "Garage", current_position: 0 } },
      "camera.hof": { state: "idle", attributes: { friendly_name: "Hof", entity_picture: "data:image/gif;base64,R0lGODlhAQABAAAAACw=" } },
    };
    let store = {
      version: 1,
      dashboards: {
        default: {
          title: "Haus",
          pages: [
            { id: "start", title: "Start", columns: 3, tiles: [
              { id: "t1", type: "light", entity: "light.wohnzimmer", name: "", icon: "", w: 1, h: 2 },
              { id: "t2", type: "toggle", entity: "switch.kaffee", name: "Kaffee", icon: "", w: 1, h: 1 },
              { id: "t3", type: "sensor", entity: "sensor.temp", name: "", icon: "", w: 1, h: 1 },
              { id: "t4", type: "clock", name: "", icon: "", w: 2, h: 1 },
              { id: "t5", type: "climate", entity: "climate.bad", name: "", icon: "", w: 2, h: 1 },
              { id: "t6", type: "cover", entity: "cover.garage", name: "", icon: "", w: 1, h: 1 },
              { id: "t7", type: "button", service: "script.gute_nacht", name: "Gute Nacht", icon: "", w: 1, h: 1 },
              { id: "t8", type: "text", text: "Hallo\nWelt", name: "Notiz", icon: "", w: 3, h: 1 },
              { id: "t9", type: "camera", entity: "camera.hof", name: "", icon: "", w: 2, h: 2 },
            ] },
            { id: "zwei", title: "Zweite", columns: 2, tiles: [] },
          ],
        },
        tablet: { title: "Tablet", pages: [{ id: "x", title: "Küche", columns: 4, tiles: [] }] },
      },
    };
    const hass = {
      states,
      language: "de",
      user: { is_admin: true },
      callWS: async (msg) => {
        if (msg.type === "tessella/get") return JSON.parse(JSON.stringify(store));
        if (msg.type === "tessella/save") { store = msg.data; window.__saved = (window.__saved || 0) + 1; return msg.data; }
        if (msg.type === "history/history_during_period") {
          const now = Date.now();
          return { [msg.entity_ids[0]]: [
            { state: "18", last_changed: new Date(now - 86400000).toISOString(), last_updated: new Date(now - 86400000).toISOString() },
            { s: "20", lu: (now - 40000000) / 1000 },
            { s: "23.5", lu: (now - 1000) / 1000 },
          ] };
        }
        throw new Error("unbekannt " + msg.type);
      },
      callService: (domain, service, data) => { window.__calls.push([domain, service, data]); return Promise.resolve(); },
    };
    const panel = document.getElementById("panel");
    panel.hass = hass;
  </script>
</body>
</html>

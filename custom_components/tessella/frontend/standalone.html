<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tessella">
  <title>Tessella</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, -apple-system, sans-serif; }
    #app { min-height: 100%; }
    .tessella-host { min-height: 100vh; }
    #login { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
    #login h1 { font-size: 1.4rem; margin: 0 0 12px; }
    #login p { color: #aaa; font-size: .95rem; line-height: 1.45; }
    #login input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; padding: 12px; border-radius: 10px;
                   border: 1px solid #444; background: #1e1e1e; color: #eee; margin: 8px 0 12px; }
    #login button { font: inherit; font-size: 1rem; padding: 12px 18px; border: 0; border-radius: 12px; background: #03a9f4; color: #fff; cursor: pointer; }
    #status { max-width: 420px; margin: 14px auto 0; padding: 0 20px; box-sizing: border-box; color: #f0a500; font-size: .95rem; min-height: 1.2em; }
    #logout { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 50; font: inherit; font-size: .75rem;
              padding: 6px 10px; border-radius: 999px; border: 1px solid #444; background: rgba(30,30,30,.85); color: #aaa; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <form id="login" hidden>
      <h1>Tessella anmelden</h1>
      <p>
        Erstelle in Home Assistant unter <b>Profil → Sicherheit → Langlebige Zugangstoken</b> einen Token
        und füge ihn hier ein. Er wird nur in diesem Browser gespeichert.
      </p>
      <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Zugangstoken">
      <button type="submit">Verbinden</button>
    </form>
    <div id="status"></div>
    <button id="logout" type="button" hidden>Abmelden</button>
  </div>
  <script src="tessella-panel.js?v=0.4.0"></script>
  <script src="tessella-standalone.js?v=0.4.0"></script>
</body>
</html>
